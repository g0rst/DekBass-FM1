# smk37-port.yaml for DekBass: every decision for the SMK-37 build, in one place.
#
# Template: genkigenki/fm1-to-smk37 (AGENTS.md step 0). Decided by the owner on 2026-11-17: pads, faders, outer keys and wheels. Values marked
# PROPOSAL are not decided yet; they are listed under open_questions at the end. Change this file first, then the code.

firmware:
  name: DekBass             # the same name on the FM-1 and the SMK-37 (no "DekBass37")
  upstream: ""              # empty: DekBass is a new firmware
  base: genkigenki/Felucca branch smk37 (Felucca 1.6 + SMK-37 board layer, = hugelton/Felucca#237)
  family: felucca           # DekBass starts from Felucca, so the HAL and both boards are there from day one
  board_layer: felucca      # already in the base: no cherry-pick needed, develop for both (docs/07)
  lost_on_smk:
    - TRS MIDI IN / MIDI clock in over TRS (PH8 is a key-matrix row on the SMK); clock over USB stays
  priorities:               # most important first (from the concept)
    - BASS and EUCLID always run together; long SEQ only changes view and knobs
    - mono bass with long glide and pitch sweeps that feel right on the keys
    - DROP / BUILD / CUT / FILL reachable at once, without menus
    - the four Konark wheels readable at a glance, same colours on screen and pads
    - speaker protection (DC, subsonic, limiter) always on

delivery:
  mode: own                 # a new firmware of the owner's own: free in name and look, no upstream PR
  pr: ""
  fork: ""                  # the DekBass repository is the home of both builds (see open_questions)
  package: dekbass-smk37.fwsc   # dekbass-smk37-elite.fwsc, dekbass-smk37-mke.fwsc; the FM-1 package: dekbass.fwsc
  usb_name: DekBass         # USB / MIDI device name; every installer's filter must include it
  data_family: DEKBASS      # 7 characters, own family: other firmwares' data is cleared on a switch
  copyright: ""             # the owner's name or handle for the file headers (see open_questions)

models:                     # one package per model, all three from the start
  - pro                     # SMK-37 Pro, also Starrykey 37 Play
  - elite                   # SMK-37 Elite
  - mke                     # MKE-P37

keys:
  middle: fm1               # keys 5..31 (F3..G5) = the FM-1's 27 keys
  outer: extend             # DECIDED: more bass notes; C3-E3 reach below the FM-1 range, where Dek bass lives
  outer_drums: {}           # only if the owner picks drums for the outer keys
  velocity: factory         # plus a KEY VELOCITY setting in MENU (DYNAMIC default), docs/06

pads:
  pattern: custom           # DECIDED: per view (see modes below)
  order: reading            # pads 1-8 top row (hardware 0..7), 9-16 bottom (8..15)
  colours: screen           # V1 deep red, V2 ochre, V3 indigo (lightened), V4 light grey; bass steps ochre
  idle: dark
  playhead: bright
  picker:
    enabled: false
  velocity: true
  notes: "BASS view: the 16 steps of the current step page. EUCLID view: see modes."

faders:
  pattern: macros           # DECIDED: the amounts that have no knob of their own (rule: no doubles)
  takeover: soft
  bank_button: ""
  banks: {}
  fixed: [pitch-sweep depth, delay throw (send + feedback), duck amount, bass / drums balance]
  screen: bar

wheels:
  pitch:
    target: bend            # DECIDED: bend on the bass, range 12 (a full octave dive for sweeps)
    range_semitones: 12
    applies_to: selected    # the bass voice
  mod:
    target: macro           # DECIDED: BUILD amount by hand (filter opens, noise rises, ratchets double)
    detail: "0 = off, up = more; the BUILD button keeps its timed riser"
  calibration: auto

rules:
  no_doubles: true
  doubles_allowed: []

knobs:
  layout: fm1               # K1 MASTER, K2-K4 the FM-1 encoders, K5-K8 the four page parameters (FM-1 KNOB 1-4)
  K1: master
  K2: page                  # PROPOSAL: the DekBass encoder order (to fix with the FM-1 button mapping)
  K3: engine / focused voice
  K4: presets
  K5: dial 1
  K6: dial 2
  K7: dial 3
  K8: dial 4
  step: detent
  pages: {}

buttons:
  map: printed              # DekBass functions (SHIFT, SEQ, PAGE, PLAY, REC, BANK, MENU, DROP, BUILD, CUT, FILL)
  names: firmware           # on the FM-1 buttons they get on the FM-1 (still open on the FM-1 too)
  extra:
    KNOB BANK: ""           # open
    FADER BANK: ""          # open
    "<": page back          # bass step page back in BASS view
    ">": page forward

screen:
  style: keep               # the same 240 x 240 DekBass screens as on the FM-1
  colours: V1 #B3202A, V2 #D49A2A, V3 #6466E0, V4 #C8C8C8 on #000000; the same on pads and screen
  rules:
    - group screens by meaning; the knob block at the bottom of the screen
    - the screen shows what you touch first (value next to the thing, a short hint line)
    - same colours and same places on screen and panel
    - no hidden modes; play first, few menus

pedal: none

modes:                      # DECIDED: the two DekBass views, each with its own pads
  BASS:
    pads: "the 16 steps of the current page (1-16, 17-32 ...); on = ochre, playhead and slide/accent brighter"
  EUCLID:
    pads: "pads 1-4 play V1-V4 by hand (finger drums), pads 5-8 mute V1-V4, pads 9-12 DROP BUILD CUT FILL,
           pads 13-16 pattern slots 1-4 (switch on the next downbeat); all in the voice colours"
  switch: long press SEQ (as on the FM-1)

open_questions:
  - KNOB BANK and FADER BANK: what do they do?
  - copyright name for the new files
  - the DekBass repository on GitHub (owner / name); pushes and releases are the owner's
  - K2-K4 order (page, engine / focused voice, presets): OK?
  - the FM-1 button mapping, still open in the concept, decides the SMK button names too
